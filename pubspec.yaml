name: qash_mobile
description: Qash print station — prints backoffice print jobs to a Bluetooth ESC/POS printer.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Android Classic/BLE/USB/Network printer connections + send().
  # NOTE: iOS support in this package is BLE + network ONLY — it does
  # NOT cover Classic/SPP on iOS. See bluetooth_service.dart header.
  flutter_pos_printer_platform_image_3: ^1.2.4

  # Builds ESC/POS command bytes from receipt data.
  http: ^1.2.0

  esc_pos_utils: ^1.1.0
  # Logo decode/resize for the receipt header (same major esc_pos_utils pins).
  image: ^3.3.0
  # Runtime permission requests (Android 12+ BLUETOOTH_SCAN/CONNECT,
  # legacy ACCESS_FINE_LOCATION on older Android).
  permission_handler: ^11.3.0

  # Used by permissions.dart to read the Android SDK version at runtime.
  device_info_plus: ^10.1.0

  # Lightweight persistence for "last connected printer" and the
  # offline print job queue.
  shared_preferences: ^2.2.3
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/main_logo_navy.png
    - assets/brand/main_logo_white.png
    - assets/brand/logotype_navy.png
    - assets/brand/logotype_white.png

# Launcher icons and splash are generated into android/ and ios/ (committed).
# The generators are NOT kept as dev_dependencies: esc_pos_utils pins image 3,
# which caps them at flutter_launcher_icons 0.11 / flutter_native_splash
# 2.2.16, and that splash version ships an Android plugin without a namespace
# that breaks the Gradle build. To regenerate after a logo change:
#   flutter pub add --dev flutter_launcher_icons flutter_native_splash
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
#   flutter pub remove flutter_launcher_icons flutter_native_splash
# then revert ios/Runner.xcodeproj/project.pbxproj and ios/Runner/Info.plist
# (0.11 mangles the pbxproj; the splash tool only reformats the plist) and
# re-add <monochrome> to mipmap-anydpi-v26/ic_launcher.xml.
# Sources in assets/brand/ were padded from the brand PNGs (Qash Assets/Qash
# Logos) — logo orange is #FF8343, navy #142566.
flutter_icons: # flutter_launcher_icons 0.11 config key
  android: true
  ios: true
  image_path: assets/brand/icon_ios.png
  min_sdk_android: 21
  adaptive_icon_background: "#FF8343"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash_logo.png
  color_dark: "#142566"
  image_dark: assets/brand/splash_logo_dark.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash_android12.png
    color_dark: "#142566"
    image_dark: assets/brand/splash_android12_dark.png
  web: false